services:
  - type: web
    name: wallet-transfer-service
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: WALLET_DB_MAX_POOL_SIZE
        value: "6"
      - key: WALLET_DB_CONNECTION_TIMEOUT_MS
        value: "60000"
      - key: WALLET_DB_LOCK_TIMEOUT
        value: 60s
      - key: WALLET_DB_STATEMENT_TIMEOUT
        value: 60s
      - key: WALLET_DB_IDLE_TIMEOUT
        value: 90s
      - key: WALLET_TRANSACTION_TIMEOUT_SECONDS
        value: "60"
      - key: WALLET_TOKEN_PEPPER
        generateValue: true
      - key: WALLET_BOOTSTRAP_ADMIN_TOKEN
        generateValue: true
