spring:
  application:
    name: wallet-transfer-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${WALLET_DB_MAX_POOL_SIZE:6}
      minimum-idle: 0
      connection-timeout: ${WALLET_DB_CONNECTION_TIMEOUT_MS:60000}
      validation-timeout: 1000
      max-lifetime: 840000
      connection-init-sql: "SET lock_timeout = '${WALLET_DB_LOCK_TIMEOUT:60s}'; SET statement_timeout = '${WALLET_DB_STATEMENT_TIMEOUT:60s}'; SET idle_in_transaction_session_timeout = '${WALLET_DB_IDLE_TIMEOUT:90s}'"
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: false
server:
  shutdown: graceful
  tomcat:
    threads:
      max: ${WALLET_HTTP_MAX_THREADS:100}
      min-spare: 4
    connection-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
wallet:
  token-pepper: ${WALLET_TOKEN_PEPPER}
  bootstrap-admin-token: ${WALLET_BOOTSTRAP_ADMIN_TOKEN}
  max-money-paise: 9000000000000000
  transaction-timeout-seconds: ${WALLET_TRANSACTION_TIMEOUT_SECONDS:60}
