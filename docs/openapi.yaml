openapi: 3.0.3
info:
  title: Wallet Transfer Service
  version: 1.0.0
paths:
  /wallets:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Existing or newly created wallet }
  /wallets/{walletId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: walletId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Wallet balance }
  /transfers:
    post:
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount_paise, idempotency_key]
              properties:
                from: { type: string, format: uuid }
                to: { type: string, format: uuid }
                amount_paise: { type: integer, format: int64, minimum: 1 }
                idempotency_key: { type: string, maxLength: 128 }
      responses:
        '200': { description: Completed, declined, or replayed transfer }
        '409': { description: Idempotency key reused for another request }
  /transfers/{transferId}:
    get:
      security: [{ bearerAuth: [] }]
      parameters: [{ name: transferId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Transfer status }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }

